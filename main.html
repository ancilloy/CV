<!DOCTYPE html>
<html>
    <head>
        <title>CV Ancillon Yaël</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

        <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

        <style>
            :root {
                --main-color: #2c5a77;
                --main-gray: #555;
                --lighter-gray: #bbb;
            }

            html {
                background-color: lightgray;
            }

            body {
                border: 1px solid darkslategray;
                background-color: white;
                font-family: "Quantico", sans-serif;

                width: 21cm;
                height: 29.7cm;

                padding: 0;
                margin: auto;
                margin-top: 5px;
                margin-bottom: 5px;

                position: relative;
            }

            div.col1 {
                position: absolute;
                left: 0;

                margin: 0;
                width: 12cm;
                height: 100%;

                color: var(--main-gray);
            }

            #linkToWeb {
                position: absolute;
                top: 5px;
                right: 5px;
                z-index: -1;

                color: var(--main-gray);
                text-decoration: underline;
                font-size: 12px;
            }

            div.col2 {
                position: absolute;
                right: 0;

                margin: 0;
                width: 9cm;
                height: 100%;

                background-color: var(--main-color);
                color: white;
            }

            h1 {
                color: var(--main-color);
                margin: 5px 0 0 15px;
                font-size: 38px;
            }

            h2 {
                margin: -5px 0 0 15px;
                padding: 0;
                font-size: 20px;
                font-weight: bolder;
            }

            h3 {
                font-size: 20px;
                color: var(--main-color);
                border-bottom: 1px solid var(--main-color);
                font-weight: bolder;

                padding: 5px;
                margin: 20px 0 2px 10px;

                position: relative;
            }

            .switchButton {
                position: absolute;
                top: 120%;
                right: 3px;

                font-size: 10px;
            }



            div.element {
                font-family: 'Courier New', Courier, monospace;
                font-size: 12px;

                box-sizing: border-box;
                width: 100%;
                padding-left: 15px;
                padding-top: 10px;
            }

            p {
                margin: 0;
            }

            span.titre {
                font-weight: bolder;
            }

            ul {
                margin: 0;
                padding-left: 15px;
            }



            table.competences {
                margin-top: 10px;
            }

            table.competences td {
                padding: 0;
                vertical-align: middle;
            }

            table.competences td:first-child {
                text-align: right;
                padding-right: 10px;
                padding-left: 15px;
            }

            .straightBar {
                width: 5cm;
                height: 10px;
                border-radius: 2px;

                margin: 0;
            }

            .circleBar {
                width: 16px;
                height: 16px;
                border-radius: 8px;

                margin: 0;
                margin-left: 5px;
            }

            .bar {
                display: inline-block;

                padding: 0;

                background-color: var(--lighter-gray);

                overflow: hidden;
                position: relative;

                color: transparent;
            }

            .subBar {
                display: inline-block;

                height: 100%;
                border-radius: inherit;

                margin: 0;
                padding: 0;

                background-color: var(--main-color);

                position: absolute;
                top: 0;
                left: 0;
            }

            .circleBar > .subBar {
                border-radius: 0;
            }



            table.coordonnees {
                margin: auto;
                margin-top: 20px;
                width: 95%;

                border-spacing: 0 20px;
            }

            table.coordonnees td {
                vertical-align: middle;
                height: 40px;
            }

            table.coordonnees td:first-child {
                padding-bottom: 0px;
                text-align: center;
            }

            div.col2 > p {
                margin: 30px 0 0 10px;
            }

            div.col2 > ul {
                list-style-type: none;
                color: var(--lighter-gray);
                padding-left: 40px;
            }

            div.col2 > ul > li {
                margin-top: 5px;
            }

            .iconCircle {
                display: inline-block;

                height: 24px;
                width: 24px;
                border-radius: 17px;
                padding: 5px;

                background-color: white;
                color: var(--main-color);
                vertical-align: middle;

                text-shadow: none;
                box-shadow: 0 0 0px white;
            }

            .coordoneesRow {
                text-shadow: 0 0 0 white;
                cursor: pointer;
                position: relative;
            }

            @keyframes textShadowAnim {
                0%   { text-shadow: 0 0 1px white; }
                100% { text-shadow: 0 0 5px white; }
            }

            .coordoneesRow:hover {
                animation: textShadowAnim 0.5s linear;
                text-shadow: 0 0 5px white;
            }

            @keyframes boxShadowAnim {
                0%   { box-shadow: 0 0 1px white; }
                100% { box-shadow: 0 0 5px white; }
            }

            .coordoneesRow:hover .iconCircle {
                animation: boxShadowAnim 0.5s linear;
                box-shadow: 0 0 5px white;
            }

            .copyBlock {
                padding: 8px;
                border-radius: 5px;

                color: white;
                background-color: #0000005f;
                text-shadow: none;
                font-size: 10px;

                position: absolute;
                top: 100%;
                left: 40%;
                z-index: 1;
            }

            #linkToGit {
                position: absolute;
                bottom: 5px;
                right: 5px;

                color: var(--lighter-gray);
                text-decoration: underline;
                font-size: 12px;
            }

            .prevent-select {
                -webkit-user-select: none; /* Safari */
                -ms-user-select: none; /* IE 10 and IE 11 */
                user-select: none; /* Standard syntax */
            }
        </style>
    </head>
    <body>
        <div id="felicitationsBox" class="copyBlock" style="top: 20px; font-size: 15px; z-index: -1;">Bravo, quelle vitesse !</div>
        <div class="col1">
            <h1>ANCILLON Yaël</h1>
            <h2 id="titreCV"></h2>
            <a id="linkToWeb" href="https://ancilloy.github.io/CV/main.html">Version Web</a>


            <h3 id="formationsTitre">Formations</h3>
            <div id="formationsBloc"></div>


            <h3 id="experiencesTitre">Expériences</h3>
            <div id="experiencesBloc"></div>


            <h3 id="projetsTitre">Projets</h3>
            <div id="projetsBloc"></div>

            <h3 id="competencesTitre">Compétences
                <button id="switchButton" class="switchButton" onclick="switchcompetencesTableau();">
                    <span class="material-symbols-outlined" style="font-size: inherit;">horizontal_rule</span>
                    <span class="material-symbols-outlined" style="font-size: inherit;">swap_horiz</span>
                    <span class="material-symbols-outlined" style="font-size: inherit;">more_horiz</span>
                </button>
            </h3>
            <table id="competencesTableau" class="competences">
            </table>
            <div class="element">
                <p id="competencesEnum"></p>
            </div>
        </div>
        <div class="col2">
            <table id="coordTable" class="coordonnees">
            </table>

            <p>RQTH</p>

            <p>Langues :</p>
            <ul>
                <li>Français (langue maternelle)</li>
                <li>Anglais (C1)</li>
            </ul>

            <a id="linkToGit" href="https://github.com/ancilloy/CV">Dépot Git</a>
        </div>

        <script>
            ////////////////////////////
            //////// Formations ////////
            ////////////////////////////

            function loadFormations(formationsList) {
                let formationsBloc = document.getElementById("formationsBloc");

                if (formationsList==null || formationsList.length==0) {
                    document.getElementById("formationsTitre").remove();
                    formationsBloc.remove();
                } else {
                    for (let i=0; i<formationsList.length; i++) {
                        let frm = document.createElement("div");
                        frm.className = "element";

                        let p1 = document.createElement("p");
                        p1.innerHTML = `<span class="titre">${formationsList[i].titre},</span> ${formationsList[i].dates}, ${formationsList[i].annexe}`;
                        frm.appendChild(p1);

                        let p2 = document.createElement("p");
                        p2.innerHTML = formationsList[i].ecole;
                        frm.appendChild(p2);

                        formationsBloc.appendChild(frm);
                    }
                }

            }



            /////////////////////////////
            //////// Experiences ////////
            /////////////////////////////

            function loadExperiences(experiencesList) {
                let experiencesBloc = document.getElementById("experiencesBloc");

                if (experiencesList==null || experiencesList.length==0) {
                    document.getElementById("experiencesTitre").remove();
                    experiencesBloc.remove();
                } else {

                    for (let i=0; i<experiencesList.length; i++) {
                        let exp = document.createElement("div");
                        exp.className = "element";

                        let p1 = document.createElement("p");
                        p1.innerHTML = `<span class="titre">${experiencesList[i].titre},</span> ${experiencesList[i].dates}`;
                        exp.appendChild(p1);

                        let p2 = document.createElement("p");
                        p2.innerHTML = `${experiencesList[i].entreprise} – ${experiencesList[i].lieu}`;
                        exp.appendChild(p2);

                        if (experiencesList[i].description!= null) {
                            let p3 = document.createElement("p");
                            p3.innerHTML = experiencesList[i].description;
                            exp.appendChild(p3);
                        }

                        if (experiencesList[i].descList!= null) {
                            let p4 = document.createElement("p");

                            let ul4 = document.createElement("ul");
                            for (let j=0; j<experiencesList[i].descList.length; j++) {
                                let li4 = document.createElement("li");
                                li4.innerHTML = experiencesList[i].descList[j];
                                ul4.appendChild(li4);
                            }

                            p4.appendChild(ul4);
                            exp.appendChild(p4);
                        }

                        experiencesBloc.appendChild(exp);
                    }

                }

            }



            /////////////////////////
            //////// Projets ////////
            /////////////////////////

            function loadProjets(projetsList) {
                let projetsBloc = document.getElementById("projetsBloc");

                if (projetsList==null || projetsList.length==0) {
                    document.getElementById("projetsTitre").remove();
                    projetsBloc.remove();
                } else {
                    for (let i=0; i<projetsList.length; i++) {
                        let prj = document.createElement("div");
                        prj.className = "element";
                        prj.innerHTML = `<p><span class="titre">${projetsList[i].titre} (${projetsList[i].dates}) :</span> ${projetsList[i].desc}</p>`;
                        projetsBloc.appendChild(prj);
                    }
                }

            }



            /////////////////////////////
            //////// Competences ////////
            /////////////////////////////

            function straightBar(level) {
                let bar = document.createElement("span");
                bar.className = "bar straightBar";
                bar.innerHTML = `${level}%`;

                let subBar = document.createElement("span");
                subBar.className = "subBar";
                subBar.style = `width: ${level}%;`;

                bar.appendChild(subBar);
                return bar;
            }

            function circleBar(level) {
                let fullCircleBar = document.createElement("span");

                for(let n=0; n<100; n+=20) {
                    let subCircle = document.createElement("span");
                    if (n==0) { subCircle.innerHTML = `${level}%`; }
                    subCircle.className = "bar circleBar";

                    let subBar = document.createElement("span");
                    subBar.className = "subBar";

                    if (n+20<=level) {
                        subBar.style = "width: 100%;";
                    } else if (level<n) {
                        subBar.style = "width: 0;";
                    } else {
                        subBar.style = `width: ${(level-n)*5}%;`;
                    }

                    subCircle.appendChild(subBar);
                    fullCircleBar.appendChild(subCircle);
                }

                return fullCircleBar;
            }

            function loadCompetences(competences, mode) {
                let competencesTableauListe, competencesEnumListe;
                if (competences==null) {
                    competencesTableauListe = null;
                    competencesEnumListe    = null;
                } else {
                    competencesTableauListe = competences.competencesTableauListe;
                    competencesEnumListe    = competences.competencesEnumListe;
                }

                let competencesTableau = document.getElementById("competencesTableau");
                if (competencesTableauListe==null) {
                    competencesTableau.remove();
                    document.getElementById("switchButton").remove();
                } else {
                    competencesTableau.innerHTML = "";

                    for (let i=0; i<competencesTableauListe.length; i++) {
                        let newRow = document.createElement("tr");

                        let td1 = document.createElement("td");
                        td1.innerHTML = competencesTableauListe[i].name;
                        newRow.appendChild(td1);

                        let td2 = document.createElement("td");
                        td2.appendChild( (mode=="circle") ? circleBar(competencesTableauListe[i].level) : straightBar(competencesTableauListe[i].level) );
                        newRow.appendChild(td2);

                        competencesTableau.appendChild(newRow);
                    }
                }

                let competencesEnum = document.getElementById("competencesEnum");
                if (competencesEnumListe==null) {
                    competencesEnum.remove();
                } else {
                    let prefix = (competencesTableauListe!=null) ? '<span class="titre">Autres :</span> ' : "";
                    competencesEnum.innerHTML = prefix + competencesEnumListe;
                }

                /* <span class="titre">Autres :</span>  */
            }



            /////////////////////////////
            //////// Coordonnees ////////
            /////////////////////////////

            let coordList = [
                { icon: "location_on", value: "12 Allée Simone de Beauvoir\n38800 Le Pont-de-Claix" },
                { icon: "mail",        value: "yael.ancillon@gmail.com" },
                { icon: "phone",       value: "06 22 67 63 71" }
            ];

            let visibleCopyBlocks = [];

            function reloadCoords() {
                let coordTable = document.getElementById("coordTable");

                for (let i=0; i<coordList.length; i++) {
                    let newRow = document.createElement("tr");
                    newRow.className = "coordoneesRow prevent-select";

                    let copyBlock = document.createElement("div");
                    copyBlock.innerHTML = "Copié !";
                    copyBlock.className = "copyBlock";
                    copyBlock.id = `copyBlock-${i}`;
                    copyBlock.style.zIndex = -1;
                    newRow.appendChild(copyBlock);
                    visibleCopyBlocks.push(false);
                    newRow.addEventListener("click",
                        function (event) {
                            navigator.clipboard.writeText(coordList[i].value);
                            copyBlock.style.zIndex = 1;
                            visibleCopyBlocks[i] = true;
                            setTimeout(() => {
                                copyBlock.style.zIndex = -1;
                                visibleCopyBlocks[i] = false;
                            }, 1200);
                            if (!visibleCopyBlocks.includes(false)) {
                                let felicitationsBox = document.getElementById("felicitationsBox");
                                felicitationsBox.style.zIndex = 1;
                                setTimeout(() => {
                                    felicitationsBox.style.zIndex = -1;
                                }, 2000);
                            }
                        },
                        false,
                    );

                    let td1 = document.createElement("td");
                    td1.innerHTML = `<span class="iconCircle"><span class="material-symbols-outlined">${coordList[i].icon}</span></span>`;
                    newRow.appendChild(td1);

                    let td2 = document.createElement("td");
                    td2.innerHTML = `<p>${coordList[i].value.replace("\n", "</p><p>")}</p>`
                    newRow.appendChild(td2);

                    coordTable.appendChild(newRow);
                }
            }
            reloadCoords();




            function prepareForPdf() {
                let body = document.body;
                body.style.margin = 0;
                body.style.border = 0;
                document.getElementById("linkToWeb").style.zIndex = 1;
                document.getElementById("linkToGit").remove();

                document.getElementById("switchButton").remove();
                for (let i=0; i<coordList.length; i++) {
                    document.getElementById(`copyBlock-${i}`).remove();
                }
                document.getElementById("felicitationsBox").remove();
            }



            /////////////////////////////
            //////// Modes de CV ////////
            /////////////////////////////

            //Formations
            let f_master = {
                titre: "Master Génie Informatique",
                dates: "2022 – 2024",
                annexe: "mention Assez Bien",
                ecole: "Université Grenoble Alpes – Saint-Martin-d’Hères, 38"
            };
            let f_licence = {
                titre: "Licence Informatique",
                dates: "2019 – 2022",
                annexe: "mention Bien",
                ecole: "Université Grenoble Alpes – Saint-Martin-d’Hères, 38"
            };
            let f_bac = {
                titre: "Baccalauréat Général",
                dates: "2019",
                annexe: "Scientifique, mention Assez Bien",
                ecole: "Lycée de la Matheysine – La Mure, 38"
            };

            //Experiences
            let e_serviceCivique = {
                titre: "Service Civique",
                dates: "09/2025 - 04/2026",
                entreprise: "France Travail",
                lieu: "Grenoble, 38",
                description: "Accompagner les usagers dans l’utilisation des outils numériques de Pôle emploi afin d'être facilitateur d’inclusion numérique et participer à des activités favorisant le lien social."
            };
            let e_stagesCognizant = {
                titre: "Stages Salesforce",
                dates: "05/2023 - 08/2023  et  04/2024 - 09/2024",
                entreprise: "Cognizant",
                lieu: "Grenoble, 38",
                descList: [
                    "Formation à l’utilisation et à la configuration de la plateforme Salesforce",
                    "Introduction à certains outils DevOps (Workbench, Gearset)",
                    "Projet fictif : développement et configuration d’une organisation Salesforce, et des divers outils qui la composent afin de correspondre aux spécifications du client."
                ]
            };

            //Projets
            let p_rebirth = {
                titre: "Projet personnel",
                dates: "09/2024 - 04/2025",
                desc: "création d’un site web avec un ami, afin de se familiariser avec le développement web et ses langages (HTML, JavaScript, CSS)."
            };
            let p_blokus = {
                titre: "Fin de Licence",
                dates: "05/2022",
                desc: "programmation d’un jeu de société (Blokus), en Java, en groupe de 6, pendant 5 semaines. Focus sur la création du joueur virtuel et son optimisation."
            };

            //Competences
            let competencesDeveloppement = [
                { name: "Git", level: 85 },
                { name: "Java", level: 80 },
                { name: "Javascript", level: 75 },
                { name: "HTML", level: 75 },
                { name: "CSS", level: 75 },
                { name: "C", level: 70 },
                { name: "Python", level: 65 },
                { name: "Salesforce", level: 55 }
            ];
            /*let competences = {
                competencesTableauListe : [
                    { name: "Git", level: 85 },
                    { name: "Java", level: 80 },
                    { name: "Javascript", level: 75 },
                    { name: "HTML", level: 75 },
                    { name: "CSS", level: 75 },
                    { name: "C", level: 70 },
                    { name: "Python", level: 65 },
                    { name: "Salesforce", level: 55 }
                ],
                competencesEnumListe : "Méthodologie Agile (Kanban, Scrum...), DevOps, C++, Bash, Docker, SQL, Ocaml, Ionic"
            }*/

            let allModes = {
                "developpeur" : {
                    titre: "Développeur - Ingénieur Logiciel",
                    formationsList: [f_master, f_licence, f_bac],
                    experiencesList: [e_serviceCivique, e_stagesCognizant],
                    projetsList: [p_rebirth, p_blokus],
                    competences: {
                        competencesTableauListe: competencesDeveloppement,
                        competencesEnumListe: "Méthodologie Agile (Kanban, Scrum...), DevOps, C++, Bash, Docker, SQL, Ocaml, Ionic"
                    }
                },

                "mediation" : {
                    titre: "Médiation numérique",
                    formationsList: [f_master, f_licence, f_bac],
                    experiencesList: [e_serviceCivique],
                    projetsList: null,
                    competences: {
                        competencesTableauListe: null,
                        competencesEnumListe: "Patience, pédagogie, aisance relationnelle, connaissances en informatique et en bureautique"
                    }
                },

                "accueil" : {
                    titre: "Hôte d'accueil",
                    formationsList: [f_master, f_licence, f_bac],
                    experiencesList: [e_serviceCivique],
                    projetsList: null,
                    competences: {
                        competencesTableauListe: null,
                        competencesEnumListe: "Patience, pédagogie, aisance relationnelle, connaissances en informatique et en bureautique"
                    }
                },
            }

            let urlParams = new URLSearchParams(window.location.search);

            let mode = urlParams.get("mode");
            if (mode==null || allModes[mode]==null) { mode = "developpeur"; }

            document.getElementById("titreCV").innerHTML = allModes[mode].titre;
            document.getElementById("linkToWeb").href = `https://ancilloy.github.io/CV/main.html?mode=${mode}`;
            loadFormations(allModes[mode].formationsList);
            loadExperiences(allModes[mode].experiencesList);
            loadProjets(allModes[mode].projetsList);

            let competencesStatut = "straight";
            function switchcompetencesTableau() {
                if (competencesStatut!="circle") { competencesStatut = "circle"; }
                else { competencesStatut = "straight"; }

                loadCompetences(allModes[mode].competences, competencesStatut);
            }

            loadCompetences(allModes[mode].competences, competencesStatut);

            let pdf = urlParams.get("pdf");
            if (pdf!=null) { prepareForPdf(); }

        </script>
    </body>
</html>
